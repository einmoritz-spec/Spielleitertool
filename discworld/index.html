<script>
window.gmMap=function(){
  var o=document.getElementById("kartePop"); if(o){ o.remove(); return; }
  o=document.createElement("div"); o.id="kartePop"; o.className="kartepop";
  o.innerHTML='<div class="ks"><img src="img/karte.webp" alt="Die Straßen von Ankh-Morpork" draggable="false"></div><button class="kx" aria-label="Schließen">×</button>';
  var ks=o.querySelector(".ks"), im=o.querySelector("img"), z=false, d=null;
  o.querySelector(".kx").onclick=function(){ o.remove(); };
  o.onclick=function(e){ if(e.target===o) o.remove(); };
  im.onclick=function(e){ if(im.dataset.drag){ im.dataset.drag=""; return; } z=!z; o.classList.toggle("gross",z);
    if(z){ var r=im.getBoundingClientRect(); ks.scrollLeft=(e.clientX-r.left)/r.width*ks.scrollWidth-ks.clientWidth/2; ks.scrollTop=(e.clientY-r.top)/r.height*ks.scrollHeight-ks.clientHeight/2; } };
  ks.onmousedown=function(e){ if(!z) return; d={x:e.clientX,y:e.clientY,l:ks.scrollLeft,t:ks.scrollTop}; };
  window.addEventListener("mousemove",function mv(e){ if(!document.body.contains(o)){ window.removeEventListener("mousemove",mv); return; } if(!d) return; var dx=e.clientX-d.x,dy=e.clientY-d.y; if(Math.abs(dx)+Math.abs(dy)>4) im.dataset.drag="1"; ks.scrollLeft=d.l-dx; ks.scrollTop=d.t-dy; });
  window.addEventListener("mouseup",function(){ d=null; });
  document.body.appendChild(o);
};
</script>
