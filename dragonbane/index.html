<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, viewport-fit=cover">
<meta name="theme-color" content="#f3eee6">
<title>Dragonbane</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">

<body>
<div class="topbar">
  <button class="brand" onclick="go('start')" aria-label="Dragonbane"><img src="../assets/logos/dragonbane.webp" alt="Dragonbane"></button>
  <div class="topbar-spacer"></div>
  <button class="ib tb-burger" onclick="openMenu(true)" aria-label="Menü" title="Menü"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</div>
<div class="rail"><div class="rl"></div><div class="md"></div><div class="rr"></div></div>
<div id="app"></div>
<div class="mm-backdrop" id="mmB" onclick="openMenu(false)"></div>
<div class="mm-panel" id="mmP"></div>
<script src="js/data/buecher.js"></script>
<script src="js/data/kapitel.js"></script>
<script src="../bookviewer/find.js"></script><script src="../bookviewer/bookviewer.js"></script>
<script src="js/app.js"></script>
<script>BV.init({ libBase:"../bookviewer/lib/", defaultBook:"db_rb", books:DB_BUECHER.reduce(function(a,g){ return a.concat(g.items.map(function(b){ return {key:b.id, name:b.name+" ("+b.lang+")"}; })); },[]), openSettings:function(){ openMenu(true); } });
render();</script>
<script src="../toolmenu.js"></script>
<script>try{localStorage.setItem("gm_tool_mode_v1","dragonbane");}catch(e){} window.gmBook=function(){return {name:"Dragonbane Regelbuch",open:function(){BV.open("db_rb",1);}};};</script>
