<div class="topbar">

  <button class="ik" onclick="openMenu(true)" aria-label="Menü" title="Menü"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</div>
<div id="app"></div>

<script>BV.init({ libBase:"../bookviewer/lib/", defaultBook:"ht_core", books:HT_BUECHER.reduce(function(a,g){ return a.concat(g.items.map(function(b){ return {key:b.id, name:b.name+" ("+b.lang+")", off:b.off||0}; })); },[]), openSettings:function(){ openMenu(true); } });
render();</script>
<script src="../toolmenu.js"></script>
<script>try{localStorage.setItem("gm_tool_mode_v1","heart");}catch(e){} window.gmBook=function(){return {name:"Heart Regelbuch",open:function(){BV.open("ht_core",1);}};};</script>
