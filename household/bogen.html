<body>

<script src="js/data/bogen-vorlagen.js"></script>
<script src="js/bogen.js"></script>
<script>
/* Eigenständige Bogen-Seite für Mitspieler: nur der Charakterbogen, nichts von der Spielleiter-Tafel */
(function(){
  var APP = document.getElementById("app");
  function render(){ var id = (location.hash.split("/")[1] || ""); APP.innerHTML = HB.ansicht(id); }
  HB.basis("", "../", function(id){ location.hash = id ? "bogen/" + id : "bogen"; });
  addEventListener("hashchange", function(){ if(/^#bogen=/.test(location.hash)) HB.linkImport().then(render, render); else render(); });
  HB.linkImport().then(render, render);
})();
</script>
</body>
