<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Into the Odd</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="../bookviewer/bookviewer.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar">
  <button class="brand" onclick="go('start')" aria-label="Into the Odd"><img src="../assets/logos/into-the-odd.webp" alt="Into the Odd"></button>
  <nav class="ktabs" id="ktabs"></nav>
  <div class="sp"></div>
  <button class="ik" onclick="infoOpen()" aria-label="Überblick" title="Überblick"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><circle cx="12" cy="7.6" r=".6" fill="currentColor"/></svg></button>
  <button class="ik" onclick="openBook('ito_core',1)" aria-label="Buch öffnen" title="Buch"><svg viewBox="0 0 24 24"><path d="M3.5 5.5C6.5 4.3 9.5 4.5 12 6.5c2.5-2 5.5-2.2 8.5-1v13c-3-1.2-6-1-8.5 1-2.5-2-5.5-2.2-8.5-1z"/><path d="M12 6.5v13"/></svg></button>
  <button class="ik" onclick="openMenu(true)" aria-label="Menü" title="Menü"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</div>
<div id="app"></div>
<div class="mm-backdrop" id="mmB" onclick="openMenu(false)"></div>
<div class="mm-panel" id="mmP"></div>
<script src="js/data/buecher.js"></script>
<script src="../bookviewer/find.js"></script><script src="../bookviewer/bookviewer.js"></script>
<script src="js/app.js"></script>
<script>BV.init({ libBase:"../bookviewer/lib/", defaultBook:"ito_core", books:ITO_BUECHER.reduce(function(a,g){ return a.concat(g.items.map(function(b){ return {key:b.id, name:b.name+" ("+b.lang+")"}; })); },[]), openSettings:function(){ openMenu(true); } });
render();</script>
<script src="../toolmenu.js"></script>
<script>try{localStorage.setItem("gm_tool_mode_v1","intotheodd");}catch(e){}</script>
</body>
</html>
