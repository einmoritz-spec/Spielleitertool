<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<title>Nights of Paynetown — City of Mist</title>
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="responsive.css">
<link rel="stylesheet" href="rules.css">
<link rel="stylesheet" href="../shared/cards.css">
<link rel="stylesheet" href="../shared/notes.css">
<link rel="stylesheet" href="../bookviewer/bookviewer.css">
<link rel="stylesheet" href="../shared/layout.css">
</head>
<body>
<div class="topbar">
  <button class="brand" onclick="goHome()">Nights of Paynetown</button>
  <div class="topbar-spacer"></div>
  <button class="tb-btn" onclick="goHome()"><span class="tb-lbl">Kampagne</span></button>
  <button class="tb-btn" onclick="goLastCase()"><span class="tb-lbl">Fall</span></button>
  <button class="tb-btn" onclick="goMap()"><span class="tb-lbl">Karte</span></button>
  <button class="tb-btn" onclick="toggleRules()"><span class="tb-lbl">Regeln</span></button>
  <button class="tb-btn" onclick="goRegister()"><span class="tb-lbl">Register</span></button>
  <button class="tb-btn" onclick="openPageViewer()"><span class="tb-lbl">Seiten</span></button>
  <button class="tb-btn" onclick="openSearch()"><span class="tb-lbl">Suche</span></button>
  <button class="tb-btn tb-gear" onclick="openSettings()" aria-label="Einstellungen" title="Einstellungen">Einstellungen</button>
  <button class="tb-burger" onclick="openMobileMenu()" aria-label="Menü öffnen" title="Menü"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</div>
<div id="app" class="shell"></div>

<div class="modal-overlay" id="searchModal" onclick="if(event.target===this)closeModal('searchModal')">
  <div class="modal">
    <div class="modal-head"><h2>Volltextsuche</h2><button class="modal-close" onclick="closeModal('searchModal')">✕</button></div>
    <div class="modal-body">
      <input class="search-input" id="searchInput" placeholder="Suche in allen erfassten Fällen … (mind. 2 Zeichen)" oninput="runSearch(this.value)" autocomplete="off">
      <div id="searchCount" class="search-count"></div>
      <div id="searchResults"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="settingsModal" onclick="if(event.target===this)closeModal('settingsModal')">
  <div class="modal">
    <div class="modal-head"><h2>Einstellungen</h2><button class="modal-close" onclick="closeModal('settingsModal')">✕</button></div>
    <div class="modal-body">
      <h3>Tool wechseln</h3>
      <div class="set-tool">
        <button onclick="switchTool('wake')"><b>Wake of the Oldways</b><small>Legend in the Mist – Erzähler-Tafel</small></button>
        <button onclick="switchTool('locallegends')"><b>Local Legends</b><small>City of Mist – Fall-Akte</small></button>
        <button class="active" disabled><b>Nights of Paynetown</b><small>City of Mist – Kampagne (aktuell)</small></button>
        <button onclick="switchTool('otherscape')"><b>Otherscape</b><small>Cyberpunk-Fantasy – Regeln, Tokyo, Abenteuer</small></button>
      </div>
      <div id="bvSettingsHost"></div>
      <h3>Spielstand</h3>
      <div class="set-row">
        <button class="btn" onclick="exportState()">Sichern (Datei)</button>
        <label class="btn">Laden<input type="file" accept="application/json" hidden onchange="importState(this)"></label>
        <button class="btn danger" onclick="resetState()">Zurücksetzen</button>
      </div>
    </div>
  </div>
</div>

<div class="pv" id="pageViewer" hidden>
  <div class="pv-bar">
    <button class="btn" onclick="pvStep(-1)" aria-label="Vorherige Seite">‹</button>
    <input id="pvNum" type="number" min="1" max="296" onchange="pvGo(+this.value)" aria-label="Seitennummer">
    <span class="pv-of">/ 296</span>
    <button class="btn" onclick="pvStep(1)" aria-label="Nächste Seite">›</button>
    <button class="btn" onclick="pvZoom()" id="pvZoomBtn">Zoom</button>
    <span class="pv-sp"></span>
    <button class="btn" onclick="closePageViewer()">✕</button>
  </div>
  <div class="pv-stage" id="pvStage"><img id="pvImg" alt="Originalseite"></div>
</div>

<script src="js/tool-switch.js"></script>
<script src="js/data/regeln/aktionen.js"></script>
<script src="js/data/regeln/zustaende.js"></script>
<script src="js/data/regeln/glossar.js"></script>
<script src="js/rules.js"></script>
<script src="js/mobile-menu.js"></script>
<script src="js/data/campaign.js"></script>
<script src="js/data/map.js"></script>
<script src="../shared/notes.js"></script>
<script src="../bookviewer/bookviewer.js"></script>
<script src="js/app.js"></script>
<script>BV.init({ libBase:"../bookviewer/lib/", defaultBook:"nights", books:[{key:"nights", name:"Nights of Paynetown (DE)"}], openSettings:function(){ openModal("settingsModal"); } }); document.getElementById("bvSettingsHost").innerHTML = BV.settingsHTML(); BV.refresh();</script>
<script src="../toolmenu.js"></script>
<script>window.UX_CFG={cols:[{box:".chbody",side:".statusrow"}]};</script>
<script src="../shared/ux.js"></script>
<script src="../shared/zeigen.js"></script>
</body>
</html>
