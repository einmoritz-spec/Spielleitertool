<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<title>Otherscape – Spielleiter-Tafel</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Erzähler-Tafel">
<link rel="stylesheet" href="fonts.css">

</head>
<body>
<div class="topbar">
  <button class="brand" onclick="goHome()" aria-label="Otherscape"><img src="img/logo.webp" alt="Otherscape"></button>
  <div class="topbar-spacer"></div>
  <button class="tb-btn" onclick="goHome()"><span class="tb-lbl">Start</span></button>
  <button class="tb-btn" onclick="goLastAdv()"><span class="tb-lbl">Abenteuer</span></button>
  <button class="tb-btn" onclick="location.hash='#/tokyo'"><span class="tb-lbl">Tokyo</span></button>
  <button class="tb-btn" onclick="location.hash='#/fraktionen'"><span class="tb-lbl">Fraktionen</span></button>
  <button class="tb-btn" onclick="location.hash='#/gegner'"><span class="tb-lbl">Gegner</span></button>
  <button class="tb-btn" onclick="location.hash='#/katalog'"><span class="tb-lbl">Katalog</span></button>
  <button class="tb-btn" onclick="location.hash='#/kits'"><span class="tb-lbl">Kits</span></button>
  <button class="tb-btn" onclick="location.hash='#/regeln'"><span class="tb-lbl">Regelwerk</span></button>
  <button class="tb-btn" onclick="location.hash='#/metro'"><span class="tb-lbl">Metro</span></button>
  <button class="tb-btn" onclick="location.hash='#/archetypen'"><span class="tb-lbl">Archetypen</span></button>
  <button class="tb-btn" onclick="location.hash='#/charaktererstellung'"><span class="tb-lbl">Charakter</span></button>
  <button class="tb-btn" onclick="location.hash='#/run'"><span class="tb-lbl">//RUN</span></button>
  <button class="tb-btn" onclick="openBook('Metro',1)"><span class="tb-lbl">Metro (PDF)</span></button>
  <button class="tb-btn" onclick="openBook('Tokyo',1)"><span class="tb-lbl">Tokyo (PDF)</span></button>
  <button class="tb-btn" onclick="toggleRules()"><span class="tb-lbl">Regeln</span></button>
  <button class="tb-btn" onclick="openSearch()"><span class="tb-lbl">Suche</span></button>
  <button class="tb-btn tb-gear" onclick="openSettings()" aria-label="Einstellungen" title="Einstellungen">Einstellungen</button>
  <button class="tb-burger" onclick="openMobileMenu()" aria-label="Menü öffnen"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</div>
<div id="app" class="shell"></div>

<aside id="rulesDrawer" class="drawer" hidden>
  <div class="drawer-head"><b>Regelblatt &amp; Würfler</b><button class="modal-close" onclick="toggleRules()">✕</button></div>
  <div class="drawer-body" id="rulesBody"></div>
</aside>

<div class="modal-overlay" id="searchModal" onclick="if(event.target===this)closeModal('searchModal')">
  <div class="modal">
    <div class="modal-head"><h2>Volltextsuche</h2><button class="modal-close" onclick="closeModal('searchModal')">✕</button></div>
    <div class="modal-body">
      <input class="search-input" id="searchInput" placeholder="Suche in allen Abenteuern … (mind. 2 Zeichen)" oninput="runSearch(this.value)" autocomplete="off">
      <div id="searchCount" class="hint"></div>
      <div id="searchResults"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="settingsModal" onclick="if(event.target===this)closeModal('settingsModal')">
  <div class="modal">
    <div class="modal-head"><h2>Einstellungen</h2><button class="modal-close" onclick="closeModal('settingsModal')">✕</button></div>
    <div class="modal-body">
      <h3>Tool wechseln</h3>
      <div class="set-tool">
        <button onclick="switchTool('wake')"><b>Wake of the Oldways</b><small>Legend in the Mist – Erzähler-Tafel</small></button>
        <button onclick="switchTool('locallegends')"><b>Local Legends</b><small>City of Mist – Fall-Akte</small></button>
        <button onclick="switchTool('paynetown')"><b>Nights of Paynetown</b><small>City of Mist – Kampagne</small></button>
        <button class="active" disabled><b>Otherscape</b><small>Cyberpunk-Fantasy – Regeln, Abenteuer (aktuell)</small></button>
      </div>
      <h3>Bücher (nur lokal)</h3>
      <div class="set-tool">
        <div class="bk-row"><div><b>Corebook Metro</b><small id="bk_metro">…</small></div><label class="btn">PDF wählen<input type="file" accept="application/pdf" hidden onchange="loadBook('Metro',this)"></label></div>
        <div class="bk-row"><div><b>Settingbook Tokyo</b><small id="bk_tokyo">…</small></div><label class="btn">PDF wählen<input type="file" accept="application/pdf" hidden onchange="loadBook('Tokyo',this)"></label></div>
      </div>
      <h3>Spielstand</h3>
      <div class="set-row">
        <button class="btn" onclick="exportState()">Sichern (Datei)</button>
        <label class="btn">Laden<input type="file" accept="application/json" hidden onchange="importState(this)"></label>
        <button class="btn danger" onclick="resetState()">Zurücksetzen</button>
      </div>
    </div>
  </div>
</div>

<div class="bv" id="bookViewer" hidden>
  <div class="bv-bar">
    <button class="btn" onclick="bvStep(-1)" aria-label="Vorherige Seite">‹</button>
    <input id="bvNum" type="number" min="1" onchange="bvGo(this.value)" aria-label="Seitennummer"><span id="bvOf" class="hint"></span>
    <button class="btn" onclick="bvStep(1)" aria-label="Nächste Seite">›</button>
    <button class="btn" onclick="bvZoom()">Zoom</button>
    <span class="bv-title" id="bvTitle"></span>
    <button class="btn" onclick="closeBook()">✕</button>
  </div>
  <div class="bv-stage" id="bvStage"><div class="bv-pages" id="bvPages"></div></div>
</div>

<script src="js/tool-switch.js"></script>

<script>PanelUI.init({nav:'.osnav',rail:'.osrail'});</script>
<script>
// PWA: Service Worker über http(s); bei neuer Version einmal automatisch neu laden.
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  var __had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",function(){ if(__had) location.reload(); });
  window.addEventListener("load",function(){ navigator.serviceWorker.register("../sw.js").then(function(r){ r.update(); }).catch(function(){}); });
}
</script>
</body>
