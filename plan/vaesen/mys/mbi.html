<!doctype html><html lang="de"><meta charset="utf-8"><link rel="stylesheet" href="../start/base.css"><style>
body{background:linear-gradient(rgba(232,236,228,.82),rgba(232,236,228,.82)),url(../../../vaesen/img/paper.webp) center/100% 100%,#dfe2d8}
:root{--red:#5d6b3a;--soft:#5f6457;--line:#6f7563}
.hero{position:relative;height:420px;background:url(mbi/cover.webp) center 38%/cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(232,236,228,1) 0,rgba(232,236,228,.55) 25%,rgba(232,236,228,0) 55%)}
.hero .lg{position:absolute;left:50px;bottom:30px;z-index:2}

.wrap{padding:6px 50px 50px}
.sh{color:#5d6b3a}
.strip{display:flex;height:300px}
.strip a{position:relative;flex:1;background:center/cover;overflow:hidden}

.strip small{display:block;font-family:EBG;font-style:italic;font-size:14.5px;letter-spacing:0;opacity:.85;margin-top:3px}
.my{display:flex;height:260px}
.my a{position:relative;flex:1;background:#eef0e6 var(--im) center 25%/auto 80% no-repeat;background-blend-mode:multiply}
.my a:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(238,240,230,1) 20%,rgba(238,240,230,0) 48%)}
.my .t{position:absolute;left:14px;bottom:12px;z-index:2}
.my b{display:block;font-family:Mar;font-weight:400;font-size:19px;letter-spacing:.05em}.my small{font-style:italic;color:var(--soft);font-size:15px}
.dd{position:absolute;top:60px;left:22px;width:300px;background:#f6f3ea;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:10px 0;z-index:9;font-family:Mar;font-size:16px}
.dd div{padding:6px 18px;color:#3a2a1f}.dd .sub{padding-left:38px;font-size:15px;color:#6b5a4a}.dd .on{color:#5d6b3a;background:rgba(93,107,58,.1)}
.top2{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;padding:0 22px;z-index:6}
.top2 img{height:20px;filter:brightness(.2)}
