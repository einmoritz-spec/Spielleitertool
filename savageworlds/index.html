<!DOCTYPE html>

<head>

<link rel="manifest" href="../manifest.webmanifest">

<header class="topbar" id="top">

  <nav class="ktabs" id="ktabs"></nav>
  <div class="spacer"></div>
  <button class="ib" onclick="Galerie&&Galerie.open?Galerie.open('savageworlds'):0" aria-label="Galerie" title="Galerie"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></button>

  <button class="ib" onclick="bookMenu()" aria-label="Buch öffnen" title="Buch"><svg viewBox="0 0 24 24"><path d="M3 5.5c3-1.2 6-1.2 9 1 3-2.2 6-2.2 9-1V19c-3-1.2-6-1.2-9 1-3-2.2-6-2.2-9-1z"/><path d="M12 6.5V20"/></svg></button>
